[workspace]
resolver = "2"
members = [
    "fenneko-cli", "fenneko-common", "fenneko-proc", "fenneko-winapi",
]

default-members = ["fenneko-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["maslina524 <luk.kirill2804@gmail.com>"]
# repository = "https://github.com/maslina524/fenneko"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false

[profile.dev]
opt-level = "z"
lto = true
debug = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[workspace.lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery  = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }

missing_safety_doc         = "warn"
undocumented_unsafe_blocks = "warn"

# There's no point in them, it will make the code cleaner
cast_lossless            = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap       = "allow"
cast_sign_loss           = "allow"

cargo_common_metadata = "allow"