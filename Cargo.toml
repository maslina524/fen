[workspace]
resolver = "2"
members = [
    "fenneko-cli", "fenneko-common", "fenneko-proc", "fenneko-winapi",
]

default-members = ["fenneko-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["maslina524 <luk.kirill2804@gmail.com>"]
# repository = "https://github.com/maslina524/fenneko"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false

[profile.dev]
opt-level = "z"
lto = true
debug = true
codegen-units = 1
panic = "abort"
overflow-checks = true
